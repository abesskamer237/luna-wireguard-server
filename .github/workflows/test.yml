name: LUNA server CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API dependencies
        working-directory: api
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Run API tests
        working-directory: api
        run: npm test
      - name: Check JavaScript syntax
        run: |
          node --check api/server.mjs
          node --check api/peer-config.mjs
          node --check api/enrollment-token.mjs
          node --check api/access-control.mjs
          node --check api/payment-webhook.mjs
          node --check api/monetbil.mjs
          node --check api/transports.mjs
          node --check api/wss-transport.mjs
      - name: Check shell scripts
        run: bash -n scripts/install-api.sh scripts/install-wireguard.sh
